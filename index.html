<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Application de gestion et suivi de placement pour agences en Côte d'Ivoire" />
    <meta name="theme-color" content="#07152A" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlacePro" />

    <!-- GoogleFonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS v3 CDN with plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              colors: {
                night: {
                  deep: '#07152A',
                  main: '#0B1F3A',
                  card: '#142C52',
                },
                gold: {
                  DEFAULT: '#D4AF37',
                  light: '#F1D27A',
                  muted: 'rgba(212, 175, 55, 0.25)',
                },
                whatsapp: '#25D366',
                cream: '#F7F5EF',
                slateText: '#8A94A6',
              },
              fontFamily: {
                serif: ['"Playfair Display"', 'Georgia', 'serif'],
                sans: ['"Inter"', 'system-ui', 'sans-serif'],
              },
              boxShadow: {
                'gold-glow': '0 0 35px -5px rgba(212, 175, 55, 0.35)',
                'gold-soft': '0 8px 30px rgba(212, 175, 55, 0.15)',
              }
            }
          }
        }
      };
    </script>

    <style>
      .bg-hero-glow {
        background: radial-gradient(circle at 50% 25%, rgba(212, 175, 55, 0.18) 0%, rgba(11, 31, 58, 0.8) 55%, #07152A 100%);
      }
      .text-gold-gradient {
        background: linear-gradient(135deg, #F1D27A 0%, #D4AF37 50%, #B8860B 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>

    <div id="root"></div>
